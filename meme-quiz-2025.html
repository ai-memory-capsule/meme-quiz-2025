<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025年度梗王挑战赛</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Zcool+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap");
        
        body {
            font-family: "Noto Sans SC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        
        .title-font { font-family: "Zcool KuaiLe", cursive; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .option-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .option-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .option-card.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
        }
        
        .option-card.wrong {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
        }
        
        .progress-bar { transition: width 0.5s ease; }
        
        .fade-in { animation: fadeIn 0.5s ease; }
        .slide-up { animation: slideUp 0.4s ease; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.8); }
        }
        
        .pulse-glow { animation: pulse-glow 2s infinite; }
        
        .gradient-text {
            background: linear-gradient(90deg, #f472b6, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .month-badge {
            background: linear-gradient(135deg, #f472b6 0%, #8b5cf6 100%);
        }
        
        .score-pop { animation: scorePop 0.5s ease; }
        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="text-white min-h-screen">
    <div id="start-page" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-2xl w-full text-center">
            <div class="mb-8">
                <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center pulse-glow mb-6">
                    <span class="text-4xl">🎮</span>
                </div>
                <h1 class="text-5xl md:text-6xl font-bold title-font gradient-text mb-4">2025梗王挑战赛</h1>
                <p class="text-xl text-gray-400">全民欢乐版</p>
            </div>
            
            <div class="glass-card rounded-2xl p-8 mb-8 fade-in">
                <h2 class="text-2xl font-bold mb-6">比赛规则</h2>
                <div class="space-y-4 text-left text-gray-300">
                    <div class="flex items-start gap-3">
                        <span class="text-purple-400 font-bold">📅</span>
                        <span>共12个月，每月4题，总计48道题目</span>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="text-cyan-400 font-bold">⏱️</span>
                        <span>总时间8分钟，单题限时20秒</span>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="text-pink-400 font-bold">🎯</span>
                        <span>答对得10分，答错不扣分</span>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="text-green-400 font-bold">🏆</span>
                        <span>根据总分获得不同称号</span>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-2xl p-6 mb-8 fade-in">
                <label class="block text-gray-400 mb-2">请输入你的昵称</label>
                <input type="text" id="player-nickname" placeholder="输入昵称，最多10个字" maxlength="10" class="w-full px-4 py-3 rounded-xl bg-black/30 border border-gray-600 text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition-all">
            </div>
            
            <button onclick="startGame()" class="w-full py-4 px-8 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white text-xl font-bold hover:from-purple-600 hover:to-pink-600 transition-all transform hover:scale-105 shadow-lg shadow-purple-500/30">
                开始挑战
            </button>
            
            <p class="mt-6 text-gray-500 text-sm">准备好了吗？轻松答题，欢乐挑战！</p>
        </div>
    </div>
    
    <div id="quiz-page" class="hidden min-h-screen p-4">
        <div class="max-w-3xl mx-auto">
            <div class="glass-card rounded-xl p-4 mb-6">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-4">
                        <span class="month-badge px-3 py-1 rounded-full text-sm font-bold" id="current-month">1月</span>
                        <span class="text-gray-400">第 <span id="current-question" class="text-white font-bold">1</span> / <span id="total-questions">48</span> 题</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-yellow-400">⭐</span>
                        <span id="score" class="text-xl font-bold text-yellow-400">0</span>
                    </div>
                </div>
                <div class="h-2 bg-gray-700 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-purple-500 to-cyan-500 progress-bar" id="progress-bar" style="width: 0%"></div>
                </div>
                <div class="flex justify-between mt-2 text-xs text-gray-500">
                    <span>进度</span>
                    <span id="progress-text">0%</span>
                </div>
            </div>
            
            <div class="flex justify-center items-center gap-8 mb-4">
                <div class="text-center">
                    <div class="text-sm text-gray-400 mb-1">总时间</div>
                    <div class="flex items-center gap-1">
                        <span class="text-cyan-400">⏱️</span>
                        <span id="total-time" class="text-2xl font-bold text-cyan-400">8:00</span>
                    </div>
                </div>
                
                <div class="relative w-16 h-16">
                    <svg class="w-16 h-16 transform -rotate-90">
                        <circle cx="32" cy="32" r="28" stroke="rgba(255,255,255,0.1)" stroke-width="4" fill="none"/>
                        <circle cx="32" cy="32" r="28" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round" id="timer-circle" style="stroke-dasharray: 176; stroke-dashoffset: 0; transition: stroke-dashoffset 0.5s linear"/>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span id="timer" class="text-xl font-bold text-red-400">20</span>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-2xl p-8 mb-6 slide-up">
                <h3 class="text-lg text-gray-400 mb-2">题目</h3>
                <p id="question-text" class="text-2xl font-bold">这里是题目内容</p>
            </div>
            
            <div class="space-y-3" id="options-container"></div>
            
            <div id="feedback" class="hidden mt-6 glass-card rounded-xl p-4 slide-up">
                <div class="flex items-start gap-4">
                    <div id="feedback-icon" class="text-3xl">🎉</div>
                    <div>
                        <h4 id="feedback-title" class="text-xl font-bold mb-2"></h4>
                        <p id="feedback-desc" class="text-gray-300"></p>
                    </div>
                </div>
                <button onclick="nextQuestion()" class="mt-4 w-full py-3 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold hover:from-cyan-600 hover:to-blue-600 transition-all">
                    下一题
                </button>
            </div>
        </div>
    </div>
    
    <div id="result-page" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="max-w-2xl w-full text-center">
            <div class="glass-card rounded-2xl p-8 mb-6">
                <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center mb-6 pulse-glow">
                    <span id="result-icon" class="text-4xl">🏆</span>
                </div>
                
                <h1 class="text-4xl font-bold title-font gradient-text mb-2">挑战完成！</h1>
                <p id="result-title" class="text-2xl font-bold text-yellow-400 mb-4">梗王称号</p>
                
                <div class="grid grid-cols-3 gap-4 mb-8">
                    <div class="bg-black/30 rounded-xl p-4">
                        <div class="text-3xl font-bold text-purple-400" id="final-score">0</div>
                        <div class="text-gray-400 text-sm">总分</div>
                    </div>
                    <div class="bg-black/30 rounded-xl p-4">
                        <div class="text-3xl font-bold text-green-400" id="correct-count">0</div>
                        <div class="text-gray-400 text-sm">答对</div>
                    </div>
                    <div class="bg-black/30 rounded-xl p-4">
                        <div class="text-3xl font-bold text-cyan-400" id="accuracy">0%</div>
                        <div class="text-gray-400 text-sm">正确率</div>
                    </div>
                </div>
                
                <div class="bg-black/30 rounded-xl p-4 mb-6">
                    <h3 class="text-lg font-bold mb-3">称号评价</h3>
                    <p id="result-desc" class="text-gray-300">评价内容</p>
                </div>
                
                <div class="bg-black/30 rounded-xl p-4 mb-6">
                    <h3 class="text-lg font-bold mb-4">月度表现</h3>
                    <div class="grid grid-cols-4 gap-2" id="month-stats"></div>
                </div>
                
                <div class="bg-black/30 rounded-xl p-4 mb-6">
                    <h3 class="text-lg font-bold mb-3">用时统计</h3>
                    <div class="flex justify-center items-center gap-2">
                        <span class="text-cyan-400 text-2xl">⏱️</span>
                        <span id="final-time" class="text-2xl font-bold text-cyan-400">0:00</span>
                    </div>
                    <div class="text-gray-400 text-sm mt-2">总用时</div>
                </div>
            </div>
            
            <div class="flex gap-4">
                <button onclick="startGame()" class="flex-1 py-4 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold hover:from-purple-600 hover:to-pink-600 transition-all">
                    再来一局
                </button>
                <button onclick="showLeaderboard()" class="flex-1 py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold hover:from-cyan-600 hover:to-blue-600 transition-all">
                    排行榜
                </button>
            </div>
        </div>
    </div>
    
    <div id="leaderboard-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="glass-card rounded-2xl p-6 max-w-lg w-full fade-in">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold">🏆 排行榜</h2>
                <button onclick="closeLeaderboard()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="flex gap-2 mb-4">
                <button onclick="showMyLeaderboard()" id="tab-mine" class="flex-1 py-2 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold">我的记录</button>
                <button onclick="showGlobalLeaderboard()" id="tab-global" class="flex-1 py-2 rounded-lg bg-gray-700 text-gray-300 font-bold hover:bg-gray-600 transition-all">全球排行</button>
            </div>
            <div class="space-y-3" id="leaderboard-list"></div>
            <button onclick="closeLeaderboard()" class="mt-6 w-full py-3 rounded-lg bg-gray-700 text-white font-bold hover:bg-gray-600 transition-all">
                关闭
            </button>
        </div>
    </div>

let currentQuestionIndex = 0;
let score = 0;
let correctCount = 0;
let timer = 20;
let timerInterval;
let totalTime = 480;
let totalTimeInterval;
let selectedOption = null;
let currentCorrectIndex = -1;
let monthScores = {};
let startTime = 0;

["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"].forEach(m => { monthScores[m] = {correct:0,total:0}; });

let playerNickname = "";

function startGame() {
    const nicknameInput = document.getElementById("player-nickname");
    playerNickname = nicknameInput.value.trim() || "匿名玩家";
    
    currentQuestionIndex = 0; score = 0; correctCount = 0; timer = 20; totalTime = 480; selectedOption = null;
    startTime = Date.now();
    Object.keys(monthScores).forEach(m => { monthScores[m] = {correct:0,total:0}; });
    
    document.getElementById("start-page").classList.add("hidden");
    document.getElementById("result-page").classList.add("hidden");
    document.getElementById("quiz-page").classList.remove("hidden");
    
    updateTotalTimeDisplay();
    clearInterval(totalTimeInterval);
    totalTimeInterval = setInterval(updateTotalTime, 1000);
    
    loadQuestion();
}

function updateTotalTimeDisplay() {
    const m = Math.floor(totalTime / 60);
    const s = totalTime % 60;
    document.getElementById("total-time").textContent = `${m}:${s.toString().padStart(2,"0")}`;
    if (totalTime <= 60) {
        document.getElementById("total-time").classList.remove("text-cyan-400");
        document.getElementById("total-time").classList.add("text-red-400");
    } else {
        document.getElementById("total-time").classList.remove("text-red-400");
        document.getElementById("total-time").classList.add("text-cyan-400");
    }
}

function updateTotalTime() {
    totalTime--;
    updateTotalTimeDisplay();
    if (totalTime <= 0) {
        clearInterval(totalTimeInterval);
        clearInterval(timerInterval);
        showResult();
    }
}

function shuffleArray(arr) {
    const shuffled = [...arr];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function loadQuestion() {
    selectedOption = null;
    const q = quizData[currentQuestionIndex];
    
    const opts = q.options.map((opt, idx) => ({text: opt, originalIndex: idx}));
    const shuffled = shuffleArray(opts);
    currentCorrectIndex = shuffled.findIndex(opt => opt.originalIndex === q.correct);
    
    document.getElementById("current-month").textContent = q.month;
    document.getElementById("current-question").textContent = currentQuestionIndex + 1;
    document.getElementById("total-questions").textContent = quizData.length;
    document.getElementById("score").textContent = score;
    document.getElementById("question-text").textContent = q.question;
    
    const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
    document.getElementById("progress-bar").style.width = `${progress}%`;
    document.getElementById("progress-text").textContent = `${Math.round(progress)}%`;
    
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    
    shuffled.forEach((opt, idx) => {
        const card = document.createElement("div");
        card.className = "glass-card rounded-xl p-4 option-card border border-gray-700";
        card.innerHTML = `<div class="flex items-center gap-4"><div class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center font-bold text-lg">${String.fromCharCode(65 + idx)}</div><span class="text-lg">${opt.text}</span></div>`;
        card.onclick = () => selectOption(idx);
        container.appendChild(card);
    });
    
    document.getElementById("feedback").classList.add("hidden");
    
    timer = 20;
    document.getElementById("timer").textContent = timer;
    document.getElementById("timer-circle").style.strokeDashoffset = 0;
    
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
    timer--;
    document.getElementById("timer").textContent = timer;
    const len = 176;
    const offset = len - (timer / 20) * len;
    document.getElementById("timer-circle").style.strokeDashoffset = offset;
    
    if (timer <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
    }
}

function selectOption(idx) {
    if (selectedOption !== null) return;
    clearInterval(timerInterval);
    
    selectedOption = idx;
    const q = quizData[currentQuestionIndex];
    const opts = document.querySelectorAll(".option-card");
    
    opts.forEach((opt, i) => {
        if (i === currentCorrectIndex) opt.classList.add("correct");
        else if (i === idx && i !== currentCorrectIndex) opt.classList.add("wrong");
        opt.style.pointerEvents = "none";
    });
    
    if (idx === currentCorrectIndex) {
        score += 10;
        correctCount++;
        monthScores[q.month].correct++;
        const el = document.getElementById("score");
        el.classList.add("score-pop");
        setTimeout(() => el.classList.remove("score-pop"), 500);
    }
    
    monthScores[q.month].total++;
    showFeedback(idx === currentCorrectIndex, q);
}

function handleTimeout() {
    selectedOption = -1;
    const q = quizData[currentQuestionIndex];
    const opts = document.querySelectorAll(".option-card");
    
    opts.forEach((opt, i) => {
        if (i === currentCorrectIndex) opt.classList.add("correct");
        opt.style.pointerEvents = "none";
    });
    
    monthScores[q.month].total++;
    showFeedback(false, q);
}

function showFeedback(isCorrect, q) {
    const fb = document.getElementById("feedback");
    const icon = document.getElementById("feedback-icon");
    const title = document.getElementById("feedback-title");
    const desc = document.getElementById("feedback-desc");
    
    if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "回答正确！";
        title.className = "text-xl font-bold mb-2 text-green-400";
    } else {
        icon.textContent = "😅";
        title.textContent = "回答错误";
        title.className = "text-xl font-bold mb-2 text-red-400";
    }
    
    desc.textContent = q.desc;
    fb.classList.remove("hidden");
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex >= quizData.length) showResult();
    else loadQuestion();
}

function showResult() {
    clearInterval(timerInterval);
    clearInterval(totalTimeInterval);
    
    document.getElementById("quiz-page").classList.add("hidden");
    document.getElementById("result-page").classList.remove("hidden");
    
    const accuracy = Math.round((correctCount / quizData.length) * 100);
    document.getElementById("final-score").textContent = score;
    document.getElementById("correct-count").textContent = correctCount;
    document.getElementById("accuracy").textContent = `${accuracy}%`;
    
    let title = "", icon = "", desc = "";
    if (score >= 450) { title = "传说级梗王"; icon = "👑"; desc = "太强了！你是2025年的冲浪王者！"; }
    else if (score >= 380) { title = "绝世梗师"; icon = "🌟"; desc = "非常出色！你对2025年的网络文化了如指掌！"; }
    else if (score >= 300) { title = "资深冲浪达人"; icon = "🌊"; desc = "很不错！你紧跟网络潮流！"; }
    else if (score >= 200) { title = "新晋冲浪选手"; icon = "🏄"; desc = "还可以！你对网络热梗有一定了解！"; }
    else { title = "网络小白"; icon = "🐣"; desc = "加油！2025年的网络世界很精彩！"; }
    
    document.getElementById("result-title").textContent = title;
    document.getElementById("result-icon").textContent = icon;
    document.getElementById("result-desc").textContent = desc;
    
    const stats = document.getElementById("month-stats");
    stats.innerHTML = "";
    
    Object.entries(monthScores).forEach(([month, s]) => {
        const acc = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
        const card = document.createElement("div");
        card.className = "bg-black/30 rounded-xl p-3 text-center";
        card.innerHTML = `<div class="text-sm text-gray-400 mb-1">${month}</div><div class="text-lg font-bold ${acc === 100 ? "text-green-400" : acc >= 50 ? "text-yellow-400" : "text-red-400"}">${acc}%</div>`;
        stats.appendChild(card);
    });
    
    const endTime = Date.now();
    const elapsedSeconds = Math.round((endTime - startTime) / 1000);
    const elapsedMinutes = Math.floor(elapsedSeconds / 60);
    const elapsedSecs = elapsedSeconds % 60;
    document.getElementById("final-time").textContent = `${elapsedMinutes}:${elapsedSecs.toString().padStart(2, "0")}`;
    
    saveScore(score, accuracy);
}

function saveScore(score, accuracy) {
    const scores = JSON.parse(localStorage.getItem("memeQuizScores") || "[]");
    scores.push({ nickname: playerNickname, score, accuracy, date: new Date().toLocaleDateString() });
    if (scores.length > 10) scores.shift();
    localStorage.setItem("memeQuizScores", JSON.stringify(scores));
}

function showLeaderboard() {
    showMyLeaderboard();
}

function showMyLeaderboard() {
    document.getElementById("tab-mine").className = "flex-1 py-2 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold";
    document.getElementById("tab-global").className = "flex-1 py-2 rounded-lg bg-gray-700 text-gray-300 font-bold hover:bg-gray-600 transition-all";
    
    const scores = JSON.parse(localStorage.getItem("memeQuizScores") || "[]");
    const list = document.getElementById("leaderboard-list");
    
    list.innerHTML = "";
    if (scores.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-center py-4">暂无记录，快去挑战吧！</p>';
    } else {
        scores.sort((a, b) => b.score - a.score);
        scores.forEach((r, idx) => {
            const rank = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx + 1}`;
            const item = document.createElement("div");
            item.className = "flex items-center justify-between bg-black/30 rounded-xl p-4";
            item.innerHTML = `<div class="flex items-center gap-3"><span class="text-xl">${rank}</span><div><div class="font-bold">${r.score}分</div><div class="text-sm text-gray-400">${r.nickname || "匿名玩家"} · 正确率 ${r.accuracy}%</div></div></div><div class="text-gray-500 text-sm">${r.date}</div>`;
            list.appendChild(item);
        });
    }
    
    document.getElementById("leaderboard-modal").classList.remove("hidden");
}

async function showGlobalLeaderboard() {
    document.getElementById("tab-mine").className = "flex-1 py-2 rounded-lg bg-gray-700 text-gray-300 font-bold hover:bg-gray-600 transition-all";
    document.getElementById("tab-global").className = "flex-1 py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold";
    
    const list = document.getElementById("leaderboard-list");
    list.innerHTML = '<p class="text-gray-400 text-center py-4">🔄 加载中...</p>';
    
    try {
        const response = await fetch("https://ai-memory-capsule.github.io/meme-quiz-2025/leaderboard.json");
        if (response.status === 200) {
            const scores = await response.json();
            displayGlobalScores(scores);
        } else {
            displayGlobalScores(getMockGlobalScores());
        }
    } catch {
        displayGlobalScores(getMockGlobalScores());
    }
    
    document.getElementById("leaderboard-modal").classList.remove("hidden");
}

function displayGlobalScores(scores) {
    const list = document.getElementById("leaderboard-list");
    list.innerHTML = "";
    
    if (scores.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-center py-4">暂无全球记录，快来做第一个！</p>';
        return;
    }
    
    scores.sort((a, b) => b.score - a.score);
    scores.forEach((r, idx) => {
        const rank = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx + 1}`;
        const item = document.createElement("div");
        item.className = "flex items-center justify-between bg-black/30 rounded-xl p-4";
        item.innerHTML = `<div class="flex items-center gap-3"><span class="text-xl">${rank}</span><div><div class="font-bold">${r.score}分</div><div class="text-sm text-gray-400">${r.nickname} · 正确率 ${r.accuracy}%</div></div></div><div class="text-gray-500 text-sm">${r.date}</div>`;
        list.appendChild(item);
    });
}
